# Crowdcast theme: dark, teal accent (matches the project's GitHub banner).
# Adapted from Streamlit's "minimal" dark template.
[theme]
base = "dark"
primaryColor = "#38BDAE"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161D26"
codeBackgroundColor = "#161D26"
textColor = "#E6EDF3"
linkColor = "#7EE7D8"
borderColor = "#263241"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontSizes = ["40px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 500, 500, 500]
linkUnderline = false

blueColor = "#38BDAE"
greenColor = "#22C55E"
yellowColor = "#F59E0B"
orangeColor = "#F97316"
redColor = "#EF4444"
violetColor = "#8B5CF6"
